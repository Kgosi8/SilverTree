<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC Game Deals</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>PC Game Deals</h1>

    <div class="controls">
      <input type="text" id="search" placeholder="Search for a game..." />
      <label>
        <input type="checkbox" id="onlySale" />
        Only show games on sale
      </label>
      <button id="sourceBtn">Use live CheapShark deals</button>
    </div>

    <p id="info"></p>
    <div id="deals"></div>

    <script src="script.js"></script>
  </body>
</html>
